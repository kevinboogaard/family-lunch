name: Deploy naar Azure (lunch.advisor.nl)

on:
  push:
    branches: [main]
  # Commits van "Menukaart bijwerken" gebruiken GITHUB_TOKEN en starten geen push-workflows,
  # daarom ook deployen zodra die workflow klaar is.
  workflow_run:
    workflows: ["Menukaart bijwerken"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Deploy naar Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: /
          skip_app_build: true
